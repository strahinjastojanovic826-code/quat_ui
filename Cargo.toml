[package]
name = "quat_ui"
version = "0.4.0"
edition = "2024"
authors = ["Strale <strahinjastojanovic826@gmail.com>"]   
description = "A high-performance, modular UI library in Rust leveraging quaternary logic (2-bit states) with FFI support for C#, Python, and C++."
license = "AGPL-3.0-only"                     
repository = "https://github.com/strahinjastojanovic826-code/quat_ui" 
readme = "README.md"
keywords = ["ui", "quaternary", "ffi", "gui", "performance"]
categories = ["gui", "data-structures"]

[lib]
name = "quat_ui"
crate-type = ["cdylib", "rlib"] 

